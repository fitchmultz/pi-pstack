name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install worktree audit prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.4.0
      - run: npm run check:compat
      - name: Qualify the optional pi-subagents loader
        run: |
          PREFIX="$RUNNER_TEMP/pi-pstack-subagents"
          npm install --prefix "$PREFIX" --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.4.0 pi-subagents@0.84.0
          PI_HOST_INDEX="$PREFIX/node_modules/@earendil-works/pi-coding-agent/dist/index.js" \
          PI_SUBAGENTS_INDEX="$PREFIX/node_modules/pi-subagents/bundle/index.js" npm run smoke

  exact-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the fork release test prerequisite
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Qualify official Pi, the Pi fork, and the configured fitchmultz/pi-subagents
        run: node scripts/qualify-hosts.mjs
