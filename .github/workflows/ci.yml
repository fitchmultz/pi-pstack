name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Install worktree audit prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
      - run: npm run check:compat
      - name: Check standalone statechart runtime selection
        run: node --test --test-name-pattern=launcher skills/statechart/scripts/test/cli.test.ts

  exact-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hosts-cache
        with:
          path: ${{ runner.temp }}/pi-pstack-hosts
          key: pi-pstack-hosts-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('scripts/qualify-hosts.mjs') }}
      - name: Install the fork release test prerequisite
        if: steps.hosts-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Qualify official Pi, the Pi fork, and the configured fitchmultz/pi-subagents
        env:
          PI_PSTACK_HOSTS_CACHE_DIR: ${{ runner.temp }}/pi-pstack-hosts
        run: node scripts/qualify-hosts.mjs
